# nginx do container do frontend. Mesmo papel do infra/nginx.conf da vm-client;
# o que muda é que aqui o Gateway é alcançado pelo nome do serviço do compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /docs { proxy_pass http://gateway:8000/docs; }
    location /openapi.json { proxy_pass http://gateway:8000/openapi.json; }
}
