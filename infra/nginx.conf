# nginx da vm-client: serve o frontend e repassa /api para o Gateway.
#
# É o que faz o navegador ver uma origem só. Sem ele, a página em uma origem
# chamando o Gateway em outra seria cross-origin, e dependeria de CORS.
#
# O deploy.sh (ou o infra/startup-client.sh) troca GATEWAY_HOST pelo IP interno
# da vm-server antes de instalar este arquivo em /etc/nginx/sites-available/.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/sd-gastos-grpc/web/dist;
    index index.html;

    # Os arquivos do build trazem hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicação de página única: /gastos e /laboratorio não são arquivos, são
    # rotas do React Router. Tudo que não for arquivo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A ponte para o Gateway. A barra no fim do proxy_pass corta o prefixo
    # /api, então /api/expenses chega lá como /expenses.
    location /api/ {
        proxy_pass http://GATEWAY_HOST:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A interpretação em linguagem natural chama a API da Anthropic e pode
        # levar alguns segundos; o padrão de 60s dá folga de sobra.
        proxy_read_timeout 60s;
    }

    # Atalho útil na apresentação: a documentação interativa do Gateway.
    location /docs { proxy_pass http://GATEWAY_HOST:8000/docs; }
    location /openapi.json { proxy_pass http://GATEWAY_HOST:8000/openapi.json; }
}
